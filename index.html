/* --- MIRA: transições e microinterações --- */
:root { --motion-fast: 180ms; --motion-page: 280ms; }
body { overflow-x: hidden; }
nav.top { transition: box-shadow .25s ease, background .25s ease; }
nav.top:has(.links .lk:hover) { box-shadow: 0 8px 28px rgba(32,35,79,.06); }
.lk, .btn, .card, .ad, .band, .tag { transition: background-color .22s ease, color .22s ease, border-color .22s ease, transform .22s cubic-bezier(.2,.75,.25,1), box-shadow .22s ease; }
.card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(32,35,79,.09); }
.ad { transition: transform .3s ease, box-shadow .3s ease; }
.pair:hover .ad:first-child { transform: translateY(-3px) rotate(-.5deg); }
.pair:hover .ad:last-child { transform: translateY(-3px) rotate(.5deg); }
.btn:active { transform: scale(.98); }
.lk:active { transform: scale(.98); }
.hero > div:first-child { animation: mira-enter-left .55s cubic-bezier(.2,.7,.2,1) both; }
.hero > div:last-child { animation: mira-enter-right .65s cubic-bezier(.2,.7,.2,1) both; }
.sec { animation: mira-section-in .45s ease both; }
.steps .card:nth-child(2) { animation-delay: .06s; }
.steps .card:nth-child(3) { animation-delay: .12s; }
@keyframes mira-enter-left { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@keyframes mira-enter-right { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:translateX(0); } }
@keyframes mira-section-in { from { opacity:.55; } to { opacity:1; } }
@keyframes mira-page-out { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(5px); } }
@keyframes mira-page-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
main { min-height: 55vh; }
main.mira-leaving { animation: mira-page-out .12s ease both; pointer-events:none; }
main.mira-entering { animation: mira-page-in .3s cubic-bezier(.2,.7,.2,1) both; }
.card h3 { letter-spacing: -.015em; }
input, select, textarea { transition: border-color .2s ease, box-shadow .2s ease; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--v); box-shadow: 0 0 0 4px rgba(121,87,245,.12); }
.bar i { transition: width .8s cubic-bezier(.2,.75,.25,1); }
.ring { transition: background  .5s ease; }
.side .lk { transition: background .2s ease, color .2s ease, transform .2s ease; }
.side .lk:hover { transform: translateX(3px); }
#toast { box-shadow: 0 10px 30px rgba(20,19,43,.2); animation: mira-toast-in .25s ease both; }
@keyframes mira-toast-in { from { opacity:0; transform:translate(-50%,8px); } to { opacity:1; transform:translate(-50%,0); } }
@media (max-width: 860px) {
  .hero > div:first-child, .hero > div:last-child { animation-duration: .4s; }
  .card:hover { transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .hero > div:first-child, .hero > div:last-child, .sec, main.mira-leaving, main.mira-entering, #toast { animation: none !important; }
}

V.home=()=>`<div class="wrap"><section class="hero"><div><div class="eb">MIRA · MENSAGEM, INTELIGÊNCIA, RELAÇÃO E ADAPTAÇÃO</div><h1>A mesma campanha. Diferentes públicos.</h1><p class="m" style="font-size:1.1rem">A MIRA ajuda marcas e profissionais de marketing a testar campanhas, comparar públicos e adaptar a comunicação antes do lançamento, com apoio da Inteligência Artificial.</p><div class="row"><button class="btn p" data-go="nova" data-act="reset">Testa a tua campanha</button><button class="btn" data-go="home" data-an="c">Descobre como funciona</button></div></div><div><div class="pair">${ad('Original · Estudante','Mais energia para os teus planos.','Experimenta já')}<svg class="arr" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="adaptado para"><path d="M4 8h14l-3-3.5M20 16H6l3 3.5"/></svg>${ad('Adaptada · Profissional','Mais conforto e desempenho no teu dia a dia.','Descobre como','b')}</div><p class="sm m" style="margin-top:10px">Exemplo ilustrativo de um produto fictício.</p></div></section>
<section class="sec" id="c"><h2>Como funciona</h2><div class="steps" style="margin-top:24px">${[['TESTAR','Analisa a adequação da tua campanha à persona escolhida e identifica pontos fortes e oportunidades de melhoria.'],['COMPARAR','Descobre como a mesma mensagem pode funcionar de forma diferente consoante o público.'],['ADAPTAR','Gera uma nova versão da campanha, ajustando a linguagem, o tom, a imagem e o call-to-action.']].map((s,i)=>`<div class="card"><div class="dot">${i+1}</div><h3>${s[0]}</h3><p class="m" style="margin:0">${s[1]}</p></div>`).join('')}</div></section>
<section class="sec" style="padding-top:0"><div class="band"><h2>Uma ideia. Diferentes formas de comunicar.</h2><div class="pair" style="margin:20px 0">${ad('Original · Estudante universitária','Mais energia para os teus planos.','Experimenta já')}<svg class="arr" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 8h14l-3-3.5M20 16H6l3 3.5"/></svg>${ad('Adaptada · Profissional experiente','Mais conforto e desempenho no teu dia a dia.','Descobre como','b')}</div><p><b>O que mudou:</b> o título passa a destacar conforto e desempenho, o tom torna-se mais claro e orientado para benefícios, e o call-to-action fica mais informativo. A marca, o produto e a oferta mantêm-se. É um exemplo ilustrativo, não uma regra universal.</p></div></section>
<section class="sec" id="f" style="padding-top:0"><h2>Porque usar a MIRA</h2><div class="grid g4" style="margin-top:20px">${[['Mais relevância','adapta a mensagem às necessidades de cada público.'],['Mais clareza','identifica oportunidades de melhoria na comunicação.'],['Mais flexibilidade','explora diferentes abordagens criativas.'],['Mais informação','apoia decisões com uma análise estruturada.']].map(b=>`<div class="card"><h3>${b[0]}</h3><p class="m" style="margin:0">${b[1]}</p></div>`).join('')}</div><div class="note" style="margin-top:24px"><b>Nota importante:</b> o MIRA apoia o planeamento de campanhas. Não garante desempenho publicitário nem vendas, e as análises não são previsões validadas cientificamente.</div></section>
<section class="sec" style="padding-top:0"><div class="card" style="text-align:center;padding:48px 20px"><h2>Está na hora de ver a tua campanha por outros olhos.</h2><button class="btn p" data-go="nova" data-act="reset">Começar agora</button></div></section></div><footer><div class="wrap">MIRA · Protótipo universitário. As análises e adaptações são geradas por regras simples, em modo de demonstração, sem IA real.</div></footer>`;
V.sobre=()=>`<div class="wrap" style="padding:56px 20px;max-width:820px"><h1 style="font-size:clamp(2rem,4vw,3rem)">Uma forma mais inteligente de pensar a publicidade.</h1><p class="m" style="font-size:1.1rem">A MIRA é uma plataforma digital que explora o potencial da Inteligência Artificial na análise e adaptação da comunicação publicitária. A plataforma parte de uma ideia simples: uma campanha pode precisar de diferentes abordagens para comunicar de forma relevante com públicos distintos.</p><div class="grid g3" style="margin:28px 0">${[['Testar uma campanha','Avalia a adequação do anúncio à persona escolhida.'],['Comparar diferentes personas','Vê como a mesma mensagem funciona para públicos distintos.'],['Adaptar a comunicação','Gera uma nova versão com outro título, tom e call-to-action.']].map(b=>`<div class="card"><h3>${b[0]}</h3><p class="m" style="margin:0">${b[1]}</p></div>`).join('')}</div><div class="note">Estado do protótipo: a análise e a adaptação usam regras simples e modelos de texto (modo de demonstração). Está desenhado para ligar a um modelo de IA através de um servidor seguro, sem expor chaves no navegador.</div><button class="btn p" data-go="nova" data-act="reset">Começar agora</button></div>`;
const NAV=[['app','Visão geral'],['nova','Nova análise'],['camps','As minhas campanhas'],['pers','Personas'],['ajuda','Ajuda']];
const shell=(v,h)=>`<div class="wrap app"><aside class="side" aria-label="Menu do workspace">${NAV.map(n=>`<button class="lk ${v===n[0]?'on':''}" data-go="${n[0]}" ${n[0]==='nova'?'data-act="reset"':''}>${n[1]}</button>`).join('')}</aside><section>${h}</section></div>`;
const jr=n=>`<div class="stp" aria-label="Percurso">${['Campanha','Público','Análise','Adaptação'].map((t,i)=>`<div class="${i+1<n?'ok':i+1===n?'on':''}">${i+1}. ${t}</div>`).join('')}</div>`;
const stat=(n,l)=>`<div class="card"><div style="font-size:2rem;font-weight:800;color:var(--v)">${n}</div><div class="m sm">${l}</div></div>`;
const cardC=c=>`<div class="card"><div class="row sp"><h3 style="margin:0">${E(c.name)}</h3><span class="tag g">${c.ana?'Analisada':'Por analisar'}</span></div><p class="m sm" style="margin:6px 0">${E(c.brand)} · ${c.date}</p><p class="sm" style="margin:0 0 4px">Persona: <b>${E(c.p.name)}</b></p><p class="sm m">Adaptações: ${c.ads.length}${c.ads.length?' ('+c.ads.map(a=>E((getP(a.pid)||{name:'?'}).name)).join(', ')+')':''}</p><div class="row"><button class="btn s p" data-act="open" data-i="${c.id}">Abrir análise</button><button class="btn s" data-act="vers" data-i="${c.id}">Versões adaptadas</button><button class="btn s" data-act="edit" data-i="${c.id}">Editar</button><button class="btn s d" data-act="del" data-i="${c.id}">Eliminar</button></div></div>`;
const noteStore=()=>`<p class="sm m">${S.store?'Os dados ficam guardados apenas neste navegador (protótipo, sem conta). Não são guardados na nuvem.':'O armazenamento do navegador não está disponível: os dados perdem-se ao fechar a página.'}</p>`;
V.app=()=>shell('app',`<h2>Vamos melhorar a tua próxima campanha.</h2><p class="m">Começa com um anúncio e descobre como podes torná-lo mais relevante para o teu público.</p><button class="btn p" data-go="nova" data-act="reset">+ Nova campanha</button><div class="grid g3" style="margin:22px 0">${stat(S.camps.length,'Campanhas guardadas')}${stat(S.camps.filter(c=>c.ana).length,'Análises')}${stat(S.camps.reduce((a,c)=>a+c.ads.length,0),'Versões adaptadas')}</div><h3>Campanhas recentes</h3>${S.camps.length?`<div class="grid g2">${S.camps.slice(-4).reverse().map(cardC).join('')}</div>`:`<div class="card empty"><p style="margin:0 auto 12px">Ainda não tens campanhas. Cria a primeira e vê a análise em poucos minutos.</p><button class="btn p" data-go="nova" data-act="reset">Criar campanha</button></div>`}${noteStore()}`);
const fe=k=>S.err[k]?`<div class="fe" role="alert">${S.err[k]}</div>`:'';
const F=(l,k,o={})=>{const v=E((o.p?S.draft.p:S.draft)[k]||''),a=`id="f_${k}" ${o.p?'data-p':'data-f'}="${k}" ${S.err[k]?'class="e" aria-invalid="true"':''}`;return`<label for="f_${k}">${l}${o.r?' *':''}</label>`+(o.sel?`<select ${a}><option value="">Seleciona…</option>${o.sel.map(x=>`<option ${x===(o.p?S.draft.p:S.draft)[k]?'selected':''}>${x}</option>`).join('')}</select>`:o.ta?`<textarea ${a}>${v}</textarea>`:`<input ${a} type="${o.t||'text'}" value="${v}">`)+fe(k)};
V.nova=()=>{const st=S.step,d=S.draft;let h=`<h2>Nova campanha</h2>${jr(st<4?1:2)}<div class="stp">${['Campanha','Anúncio','Público','Analisar'].map((t,i)=>`<div class="${i+1<st?'ok':i+1===st?'on':''}">Passo ${i+1}: ${t}</div>`).join('')}</div><div class="card">`;
if(Object.keys(S.err).length)h+=`<div class="note" role="alert">Há campos por preencher. Verifica as mensagens a vermelho.</div>`;
if(st===1)h+=F('Nome da campanha','name',{r:1})+F('Marca ou produto','brand',{r:1})+F('Descrição do produto ou serviço','desc',{r:1,ta:1})+F('Objetivo principal','obj',{r:1,sel:OBJ})+F('Canal publicitário','channel',{r:1,sel:CH});
if(st===2)h+=`<label for="img">Imagem do anúncio (opcional)</label><input type="file" id="img" accept="image/*"><p class="sm m">A imagem serve só de pré-visualização nesta sessão. A análise lê a descrição visual que escreveres abaixo.</p>${d.img?`<img src="${d.img}" alt="Pré-visualização do anúncio" style="max-width:240px;border-radius:12px">`:''}`+F('Título original','headline',{r:1})+F('Texto do anúncio','copy',{r:1,ta:1})+F('Call-to-action original','cta',{r:1})+F('Descrição dos elementos visuais','visual',{ta:1})+F('URL da landing page (opcional)','url',{t:'url'});
if(st===3){const p=d.p;h+=`<label for="pid">Persona</label><select id="pid"><option value="">Seleciona…</option>${allP().map(x=>`<option value="${x.id}" ${d.pid===x.id?'selected':''}>${E(x.name)}${x.demo?' (demonstração)':''}</option>`).join('')}<option value="custom" ${d.pid==='custom'?'selected':''}>Criar persona personalizada</option></select>${fe('pid')}`;if(d.pid)h+=F('Nome da persona','name',{p:1,r:1})+F('Faixa etária','age',{p:1})+F('Interesses','interests',{p:1,r:1,ta:1})+F('Necessidades e motivações','needs',{p:1,r:1,ta:1})+F('Principais desafios','challenges',{p:1})+F('Estilo de comunicação preferido','style',{p:1,r:1})+F('Comportamentos relevantes','behaviours',{p:1})+F('Principais motivações de compra','purchase',{p:1})+F('Contexto adicional','ctx',{ta:1})+`<p class="sm m">As personas são exemplos ilustrativos, não descrições universais de grupos etários. Prioriza as necessidades individuais.</p>`}
if(st===4){const p=d.p;h+=`<h3>Resumo</h3><table><tr><th>Campanha</th><td>${E(d.name)} · ${E(d.brand)} · ${E(d.obj)} · ${E(d.channel)}</td></tr><tr><th>Título</th><td>${E(d.headline)}</td></tr><tr><th>Texto</th><td>${E(d.copy)}</td></tr><tr><th>CTA</th><td>${E(d.cta)}</td></tr><tr><th>Persona</th><td>${E(p.name)} (${E(p.age||'idade não indicada')})</td></tr></table><div class="note">Modo de demonstração: a análise usa regras transparentes sobre o texto que introduziste, sem modelo de IA.</div>`}
h+=`<div class="row sp" style="margin-top:22px">${st>1?'<button class="btn" data-act="back">Voltar</button>':'<span></span>'}${st<4?'<button class="btn p" data-act="next">Continuar</button>':'<button class="btn p" data-act="run">Analisar a minha campanha</button>'}</div></div>`;return shell('nova',h)};
V.load=()=>shell('nova',`<div class="card empty"><div class="spin"></div><p style="margin:0 auto">A analisar a tua campanha…</p></div>`);
const bars=D=>D.map(d=>`<div style="margin:16px 0"><div class="row sp"><b>${d.k}</b><b>${d.s}/100</b></div><div class="bar ${d.s>=70?'hi':''}" role="img" aria-label="${d.k}: ${d.s} em 100"><i style="width:${d.s}%"></i></div><p class="sm m" style="margin:6px 0 0">${d.t}</p></div>`).join('');
V.resultado=()=>{const c=S.cur;if(!c)return V.camps();const a=c.ana,st=a.D.filter(d=>d.s>=70),wk=a.D.filter(d=>d.s<60),rc=a.D.filter(d=>d.s<75);
return shell('camps',`${jr(3)}<div class="row sp"><h2>${E(c.name)}</h2><span class="tag w">Demonstração · análise por regras</span></div><div class="card"><div class="row" style="gap:24px"><div class="ring" style="background:conic-gradient(var(--g) ${a.o*3.6}deg,var(--l) 0)"><div>${a.o}</div></div><div style="flex:1;min-width:220px"><h3>Pontuação de adequação da comunicação</h3><p class="m" style="margin:0">Média de seis dimensões para a persona “${E(c.p.name)}”. ${a.o>=75?'Há bons sinais de adequação.':a.o>=60?'A adequação é parcial, com margem para melhorar.':'Há vários desencontros entre mensagem e persona.'} É um indicador de comunicação, não uma previsão de vendas ou conversões.</p></div></div></div>
<div class="card" style="margin-top:18px"><h3>Dimensões</h3>${bars(a.D)}</div><div class="grid g2" style="margin-top:18px"><div class="card"><h3>Pontos fortes</h3>${st.length?`<ul class="c">${st.map(d=>`<li>${d.k}: ${d.s}/100</li>`).join('')}</ul>`:'<p class="m">Nenhuma dimensão atingiu 70 pontos.</p>'}</div><div class="card"><h3>Possíveis desencontros</h3>${wk.length?`<ul class="c">${wk.map(d=>`<li>${d.k}: ${d.s}/100</li>`).join('')}</ul>`:'<p class="m">Sem dimensões abaixo de 60 pontos.</p>'}</div></div>
<div class="card" style="margin-top:18px"><h3>O que podes melhorar?</h3><ul class="c">${(rc.length?rc:a.D).slice(0,5).map(d=>`<li>${REC[d.k]}</li>`).join('')}</ul><p class="sm m" style="margin:10px 0 0">As pontuações vêm de regras simples aplicadas ao texto. Confirma sempre com o teu conhecimento do público.</p></div>
<div class="row" style="margin-top:20px"><button class="btn p" data-go="comparar">Adaptar para outra persona</button><button class="btn" data-act="edit" data-i="${c.id}">Editar campanha</button><button class="btn" data-act="savec">Guardar análise</button></div>${noteStore()}`)};
const pcol=(p,c)=>{const a=analyse(c,p);return`<div class="card"><h3>${E(p.name)}</h3><div class="row sp"><span class="tag">${p.demo?'Demonstração':'Personalizada'}</span><b style="font-size:1.6rem;color:var(--v)">${a.o}/100</b></div><table>${[['Perfil',E(p.age||'—')+'. '+E(p.behaviours||'')],['Motivações',E(p.needs)],['Comunicação',E(p.style)],['Benefícios relevantes',E((p.needs||'').split(/[,;]/).slice(0,2).join(', '))],['Tom recomendado',E(p.style)],['CTA sugerido',E(p.cta||'Saber mais')],['Porquê esta pontuação',a.D.slice().sort((x,y)=>x.s-y.s).map(d=>d.k+' ('+d.s+')').slice(0,2).join(' e ')+' pesam mais; vê a análise por dimensão.']].map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</table></div>`};
V.comparar=()=>{const c=S.cur;if(!c)return V.camps();const ps=allP();S.cmpA=S.cmpA||c.p;S.cmpB=S.cmpB&&S.cmpB.id!==S.cmpA.id?S.cmpB:(ps.find(p=>p.id!==c.p.id&&p.id!==c.p.src)||ps[0]);
const sel=(id,cur)=>`<label for="${id}">${id==='ca'?'Persona original':'Segunda persona'}</label><select id="${id}">${[c.p].concat(ps.filter(p=>p.id!==c.p.id)).map(p=>`<option value="${p.id}" ${p.id===cur.id?'selected':''}>${E(p.name)}</option>`).join('')}</select>`;
return shell('camps',`${jr(3)}<h2>Compara personas</h2><p class="m">A mesma campanha avaliada para dois públicos. As personas são ilustrativas; as recomendações baseiam-se em necessidades e motivações, não em estereótipos de idade.</p><div class="grid g2"><div>${sel('ca',S.cmpA)}</div><div>${sel('cb',S.cmpB)}</div></div><div class="grid g2" style="margin-top:18px">${pcol(S.cmpA,c)}${pcol(S.cmpB,c)}</div><div class="note">Cada abordagem pode fazer sentido por razões diferentes: a pontuação mostra quanto o texto atual já se aproxima de cada persona, e o tom e o CTA sugeridos indicam para onde ajustar.</div><div class="row"><button class="btn p" data-act="adaptto" data-i="${S.cmpB.id}">Adaptar para ${E(S.cmpB.name)}</button><button class="btn" data-go="resultado">Ver análise original</button></div>`)};
V.adaptar=()=>{const c=S.cur;if(!c)return V.camps();const ps=allP(),ad=c.ads[S.ai];return shell('camps',`${jr(4)}<div class="row sp"><h2>Ad Swap <span class="tag">Funcionalidade MIRA</span></h2><span class="tag w">Demonstração · texto editável, sem IA</span></div><label for="ap">Persona de destino</label><select id="ap">${ps.filter(p=>p.id!==c.p.id).map(p=>`<option value="${p.id}" ${ad&&ad.pid===p.id?'selected':''}>${E(p.name)}</option>`).join('')}</select>${c.ads.length?`<div class="row" style="margin-top:10px">${c.ads.map((a,i)=>`<button class="btn s ${i===S.ai?'p':''}" data-act="pick" data-i="${i}">${E((getP(a.pid)||{name:'?'}).name)}</button>`).join('')}</div>`:''}
${ad?`<div class="grid g2" style="margin-top:18px"><div class="card orig"><span class="tag">Campanha original</span><h3 style="margin-top:10px">${E(c.headline)}</h3><p>${E(c.copy)}</p><p><b>CTA:</b> ${E(c.cta)}</p><p class="m sm"><b>Visual:</b> ${E(c.visual||'Não descrito')}</p>${c.img?`<img src="${c.img}" alt="Anúncio original" style="max-width:100%;border-radius:12px">`:''}<p class="sm m">Persona: ${E(c.p.name)}</p></div>
<div class="card"><span class="tag g">Versão adaptada</span><label for="ah">Novo título</label><input id="ah" data-ad="headline" value="${E(ad.headline)}"><label for="ac">Texto adaptado</label><textarea id="ac" data-ad="copy">${E(ad.copy)}</textarea><label for="at">Novo CTA</label><input id="at" data-ad="cta" value="${E(ad.cta)}"><label for="av">Direção visual sugerida</label><textarea data-ad="visual" id="av">${E(ad.visual)}</textarea><p class="sm m">Persona: ${E((getP(ad.pid)||{name:'?'}).name)}</p></div></div>
<div class="card" style="margin-top:18px"><h3>O que mudou e porquê?</h3><ul class="c">${ad.ch.map(x=>`<li><b>${x[0]}:</b> ${E(x[1])}</li>`).join('')}</ul><p class="sm m" style="margin:10px 0 0">${E(ad.as)}</p></div>
<div class="row" style="margin-top:20px"><button class="btn p" data-act="regen">Gerar nova versão</button><button class="btn" data-go="comparar">Comparar versões</button><button class="btn" data-act="focus">Editar texto</button><button class="btn" data-act="savec">Guardar campanha</button><button class="btn d" data-act="reset" data-go="nova">Começar de novo</button></div>`:`<div class="card empty" style="margin-top:18px"><p>Escolhe uma persona e gera a primeira versão adaptada.</p><button class="btn p" data-act="regen">Gerar versão adaptada</button></div>`}<div class="row" style="margin-top:14px"><button class="btn s" data-go="resultado">← Voltar à campanha anterior</button></div>`)};
V.camps=()=>shell('camps',`<h2>As minhas campanhas</h2>${S.camps.length?`<div class="grid g2">${S.camps.slice().reverse().map(cardC).join('')}</div>`:`<div class="card empty"><p style="margin:0 auto 12px">Ainda não guardaste nenhuma campanha. Quando guardares uma análise, ela aparece aqui.</p><button class="btn p" data-go="nova" data-act="reset">Criar campanha</button></div>`}${noteStore()}`);
const pc=p=>`<div class="card"><div class="row sp"><h3 style="margin:0">${E(p.name)}</h3><span class="tag ${p.demo?'':'g'}">${p.demo?'Demonstração':'Criada por ti'}</span></div><p class="sm m">${E(p.age||'')}${p.demo?' · perfil ilustrativo':''}</p><p class="sm"><b>Interesses:</b> ${E(p.interests)}<br><b>Motivações:</b> ${E(p.needs)}<br><b>Comunicação:</b> ${E(p.style)}<br><b>Necessidades:</b> ${E(p.challenges||'—')}</p><div class="row"><button class="btn s p" data-act="usep" data-i="${p.id}">Selecionar</button>${p.demo?`<button class="btn s" data-act="dup" data-i="${p.id}">Duplicar e editar</button>`:`<button class="btn s" data-act="ep" data-i="${p.id}">Editar</button><button class="btn s d" data-act="dp" data-i="${p.id}">Eliminar</button>`}</div></div>`;
V.pers=()=>shell('pers',`<div class="row sp"><h2>Biblioteca de personas</h2><button class="btn p" data-act="ep" data-i="">+ Nova persona</button></div><p class="m">Exemplos ilustrativos, não descrições universais de pessoas. Cria as tuas próprias para refletir necessidades reais.</p><h3>Personas de demonstração</h3><div class="grid g3">${DEMO.map(pc).join('')}</div><h3 style="margin-top:26px">As tuas personas</h3>${S.pers.length?`<div class="grid g3">${S.pers.map(pc).join('')}</div>`:'<div class="card empty"><p style="margin:0">Ainda não criaste personas.</p></div>'}`);
V.ajuda=()=>shell('ajuda',`<h2>Ajuda</h2><div class="grid"><div class="card"><h3>Como começo?</h3><p class="m" style="margin:0">Em “Nova análise”, preenche a campanha, o anúncio e a persona. Depois vê a análise, compara com outra persona e gera uma versão adaptada.</p></div><div class="card"><h3>A análise usa IA?</h3><p class="m" style="margin:0">Não nesta versão. Usa regras simples sobre o texto, em modo de demonstração. Nunca devolve resultados medidos de mercado nem garante vendas.</p></div><div class="card"><h3>Onde ficam os meus dados?</h3><p class="m" style="margin:0">Apenas neste navegador, neste dispositivo. Não há contas nem armazenamento na nuvem no protótipo.</p></div></div>`);
let miraRenderToken=0;
function render(){
  const token=++miraRenderToken;
  const v=location.hash.slice(1)||'home', f=V[v]||V.home;
  renderNav(v);
  const main=$('#main');
  const paint=()=>{
    if(token!==miraRenderToken)return;
    main.innerHTML=S.load?V.load():f();
    main.classList.remove('mira-leaving');
    main.classList.remove('mira-entering');
    void main.offsetWidth;
    main.classList.add('mira-entering');
    if(S.anchor){const e=document.getElementById(S.anchor);e&&e.scrollIntoView({behavior:'smooth',block:'start'});S.anchor=null}
    else window.scrollTo({top:0,behavior:'smooth'});
  };
  if(!main.innerHTML || window.matchMedia('(prefers-reduced-motion: reduce)').matches){paint();return;}
  main.classList.remove('mira-entering');
  main.classList.add('mira-leaving');
  window.setTimeout(paint,120);
}
addEventListener('hashchange',render);
/* ---- ações ---- */
const need=(o,ks,msg)=>ks.forEach(k=>{if(!String(o[k]||'').trim())S.err[k]=msg||'Campo obrigatório.'});
function validate(){S.err={};const d=S.draft;if(S.step===1)need(d,['name','brand','desc','obj','channel'],'Preenche este campo para continuar.');if(S.step===2){need(d,['headline','copy','cta'],'Preenche este campo para continuar.');if(d.url&&!/^https?:\/\/\S+\.\S+/.test(d.url))S.err.url='Introduz um endereço válido, por exemplo https://exemplo.pt.'}if(S.step===3){if(!d.pid)S.err.pid='Escolhe uma persona ou cria uma personalizada.';else need(d.p,['name','interests','needs','style'],'Preenche este campo para continuar.')}return!Object.keys(S.err).length}
const fresh=()=>({p:{}});
const A={
reset(){S.draft=fresh();S.step=1;S.err={};S.cur=null;S.ai=0;S.cmpA=S.cmpB=null},
entrar(){go('app');toast('Sem contas no protótipo: os dados ficam apenas neste navegador.')},
next(){if(validate()){S.step++;render()}else{render();const e=document.querySelector('.e');e&&e.focus()}},back(){S.err={};S.step--;render()},
run(){S.load=1;render();setTimeout(()=>{try{const d=S.draft,c={id:d.id||'c'+Date.now(),name:d.name,brand:d.brand,desc:d.desc,obj:d.obj,channel:d.channel,headline:d.headline,copy:d.copy,cta:d.cta,visual:d.visual,url:d.url,ctx:d.ctx,img:d.img,date:new Date().toLocaleDateString('pt-PT'),p:{...d.p,id:d.pid==='custom'?'custom-'+Date.now():d.pid},ads:d.ads||[]};c.ana=analyse(c,c.p);if(d.pid==='custom')c.p.demo=0;S.cur=c;S.load=0;go('resultado')}catch(e){S.load=0;S.step=4;render();toast('Ocorreu um erro na análise. Tenta novamente.')}},1100)},
savec(){const c=S.cur,i=S.camps.findIndex(x=>x.id===c.id);i<0?S.camps.push(c):S.camps[i]=c;save();toast('Guardado neste navegador (protótipo).')},
open(i){S.cur=S.camps.find(c=>c.id===i);go('resultado')},vers(i){S.cur=S.camps.find(c=>c.id===i);S.ai=0;go('adaptar')},
edit(i){const c=S.camps.find(x=>x.id===i)||S.cur;S.draft={...c,pid:c.p.id,p:{...c.p},ads:c.ads};S.step=1;S.err={};go('nova')},
del(i){const c=S.camps.find(x=>x.id===i);modal(`<h3>Eliminar campanha?</h3><p>“${E(c.name)}” e as suas adaptações serão eliminadas. Esta ação não pode ser desfeita.</p><div class="row"><button class="btn d" data-act="delok" data-i="${i}">Eliminar</button><button class="btn" data-act="cm">Cancelar</button></div>`)},
delok(i){S.camps=S.camps.filter(c=>c.id!==i);save();closeM();render();toast('Campanha eliminada.')},cm(){closeM()},
adaptto(id){S.cur.ads.length&&0;const p=getP(id)||S.cmpB;S.cur.ads=S.cur.ads.filter(a=>a.pid!==p.id);S.cur.ads.push(gen(S.cur,p,0));S.ai=S.cur.ads.length-1;go('adaptar')},
regen(){const c=S.cur,pid=$('#ap')?$('#ap').value:S.cmpB.id,p=getP(pid),i=c.ads.findIndex(a=>a.pid===pid),v=i<0?0:c.ads[i].v+1,g=gen(c,p,v);if(i<0){c.ads.push(g);S.ai=c.ads.length-1}else{c.ads[i]=g;S.ai=i}render()},
pick(i){S.ai=+i;render()},focus(){const e=$('#ah');e&&e.focus()},
usep(id){S.draft=S.draft.name?S.draft:fresh();const p=getP(id);S.draft.pid=id;S.draft.p={...p};S.step=3;go('nova')},
dup(id){const p={...getP(id),id:'u'+Date.now(),demo:0,name:getP(id).name+' (cópia)',src:id};S.pers.push(p);save();A.ep(p.id)},
dp(id){S.pers=S.pers.filter(p=>p.id!==id);save();render();toast('Persona eliminada.')},
ep(id){const p=getP(id)||{},f=(k,l,ta)=>`<label for="m_${k}">${l}</label>${ta?`<textarea id="m_${k}" name="${k}">${E(p[k]||'')}</textarea>`:`<input id="m_${k}" name="${k}" value="${E(p[k]||'')}">`}`;modal(`<h3>${p.id?'Editar persona':'Nova persona'}</h3><form id="pf" data-id="${p.id||''}">${f('name','Nome *')}${f('age','Faixa etária')}${f('interests','Interesses *',1)}${f('needs','Necessidades e motivações *',1)}${f('challenges','Principais desafios')}${f('style','Estilo de comunicação *')}${f('behaviours','Comportamentos relevantes')}${f('purchase','Motivações de compra')}${f('cta','CTA preferido')}<div id="pe" class="fe" role="alert"></div><div class="row" style="margin-top:14px"><button class="btn p" type="submit">Guardar persona</button><button class="btn" type="button" data-act="cm">Cancelar</button></div></form>`)}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-act]');if(!t)return;const a=t.dataset.act,g=t.dataset.go;if(a&&A[a])A[a](t.dataset.i);if(g)go(g,t.dataset.an)});
document.addEventListener('input',e=>{const t=e.target,d=S.draft;if(t.dataset.f)d[t.dataset.f]=t.value;else if(t.dataset.p)d.p[t.dataset.p]=t.value;else if(t.dataset.ad&&S.cur)S.cur.ads[S.ai][t.dataset.ad]=t.value});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f&&t.tagName==='SELECT')S.draft[t.dataset.f]=t.value;if(t.id==='pid'){const v=t.value;S.draft.pid=v;S.draft.p=v==='custom'||!v?{}:{...getP(v)};render()}
if(t.id==='ca'||t.id==='cb'){const p=getP(t.value)||S.cur.p;t.id==='ca'?S.cmpA=p:S.cmpB=p;render()}
if(t.id==='ap')S.ai=Math.max(0,S.cur.ads.findIndex(a=>a.pid===t.value));
if(t.id==='img'&&t.files[0]){const f=t.files[0];if(f.size>4e6){toast('Imagem demasiado grande (máx. 4 MB).');return}const r=new FileReader();r.onload=()=>{S.draft.img=r.result;render()};r.readAsDataURL(f)}});
document.addEventListener('submit',e=>{if(e.target.id!=='pf')return;e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f),id=e.target.dataset.id;if(!o.name.trim()||!o.interests.trim()||!o.needs.trim()||!o.style.trim()){$('#pe').textContent='Preenche o nome, os interesses, as motivações e o estilo de comunicação.';return}
if(id){const i=S.pers.findIndex(p=>p.id===id);S.pers[i]={...S.pers[i],...o}}else S.pers.push({id:'u'+Date.now(),...o});save();closeM();render();toast('Persona guardada neste navegador.')});
render();
</script></body></html>
